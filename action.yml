name: "AI PR reviewer (budgeted, abstains)"
description: "AI pull request review with a hard token ceiling, an explicit 'I do not know' answer and no access to PR code or secrets. Works with any OpenAI-compatible endpoint."
author: "Tony Weckström"
branding:
  icon: "shield"
  color: "blue"
inputs:
  api-key:
    description: "API key for the model endpoint (store it as a secret). Empty on fork PRs: the Action then does nothing."
    required: false
  base-url:
    description: "OpenAI-compatible base URL, e.g. https://api.openai.com/v1 or https://openrouter.ai/api/v1 (https only)."
    required: true
  model:
    description: "Model name sent to the endpoint."
    required: true
  github-token:
    description: "Token for reading the PR files and writing one comment."
    required: false
    default: ${{ github.token }}
  max-input-tokens:
    description: "Hard ceiling for the estimated input (default 20000, max 100000). Files that do not fit are listed as not reviewed."
    required: false
    default: "20000"
  max-output-tokens:
    description: "Hard ceiling for the reply (default 1500, max 4000)."
    required: false
    default: "1500"
  max-runs-per-pr:
    description: "Maximum reviews per pull request across all pushes (default 5, max 20)."
    required: false
    default: "5"
  price-in:
    description: "USD per million input tokens, for the cost estimate shown in the comment (optional)."
    required: false
    default: "0"
  price-out:
    description: "USD per million output tokens (optional)."
    required: false
    default: "0"
  dry-run:
    description: "'true' prints the comment to the log instead of posting it."
    required: false
    default: "false"
  fail-on-error:
    description: "'true' fails the job when the review cannot be produced (default: never block the PR)."
    required: false
    default: "false"
runs:
  using: "node24"
  main: "src/index.js"
